[project]
name = "universe-core"
version = "0.1.0"
description = "Core service: API, WebSocket hub, event bus, chat, storage"
requires-python = ">=3.12,<3.13"
dependencies = [
    "universe-common",
    "universe-agents",
    "universe-models",
    "universe-vault",
    "universe-research",
    "python-multipart>=0.0.20",
    "fastapi>=0.143",
    "uvicorn>=0.54",
    "websockets>=17.2",
    "pydantic>=2.14",
    "psutil>=7.2",
    # Phase 6 (Research): clean main-content extraction of fetched web pages. Apache-2.0 since v1.8.0
    # (GPLv3 before), so pin >=1.8 (ADR-0008 license policy, ADR-0015). Fetch goes through the egress gate;
    # trafilatura only parses HTML we already downloaded. Playwright (JS-heavy pages) stays an optional,
    # lazily-imported helper, off by default — not a hard dependency here.
    "trafilatura>=1.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/universe_core"]

[tool.uv.sources]
universe-common = { workspace = true }
universe-agents = { workspace = true }
universe-models = { workspace = true }
universe-vault = { workspace = true }
universe-research = { workspace = true }
