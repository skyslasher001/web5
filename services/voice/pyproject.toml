[project]
name = "universe-voice"
version = "0.1.0"
description = "Voice (Phase 7): VAD, wake word, speech-to-text, text-to-speech and the audio WebSocket, all on ONNX Runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "universe-common",
    "numpy>=2.0",
    # One inference runtime for everything voice: Silero VAD, Whisper (ONNX export) and Kokoro. MIT. No PyAV
    # (LGPL FFmpeg, in-process) and no huggingface-hub client — models are fetched through Core's egress gate.
    "onnxruntime>=1.20",
    # Only the Apache-2.0 pronunciation lexicons (misaki/data). We never import misaki.en, which would need
    # num2words (LGPL) and spaCy, and never use espeak-ng (GPL-3.0). See ADR-0016.
    "misaki==0.9.4",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/universe_voice"]

[tool.uv.sources]
universe-common = { workspace = true }
