[project]
name = "universe-models"
version = "0.1.0"
description = "Hardware detection, model recommendations and the Ollama client"
requires-python = ">=3.12,<3.13"
dependencies = [
    "universe-common",
    "psutil>=7.2",
    "nvidia-ml-py>=13.0",
    "pydantic>=2.14",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/universe_models"]

[tool.uv.sources]
universe-common = { workspace = true }
