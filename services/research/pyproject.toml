[project]
name = "universe-research"
version = "0.1.0"
description = "Research (Phase 6): web search providers, page fetch + clean extraction, a TTL cache and spotlighting"
requires-python = ">=3.12,<3.13"
dependencies = [
    "universe-common",
    "trafilatura>=1.8",
    # httpx is imported for type annotations only; clients are created by Core's egress gate and passed in.
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/universe_research"]

[tool.uv.sources]
universe-common = { workspace = true }
