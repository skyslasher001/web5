[project]
name = "universe-supervisor"
version = "0.1.0"
description = "Watchdog: starts, health-checks and restarts services; last-known-good and safe mode. Standard library only."
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/universe_supervisor"]
