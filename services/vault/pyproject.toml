[project]
name = "universe-vault"
version = "0.1.0"
description = "Vault storage, ingestion pipeline, job queue, workers, search and backups"
requires-python = ">=3.12,<3.13"
dependencies = [
    "universe-common",
    "universe-models",
    "pydantic>=2.14",
    "psutil>=7.2",
    "pyyaml>=6.0.3",
    "pypdf>=6.20",
    "python-docx>=1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "pillow>=12.3",
    "tinytag>=2.3",
    "watchdog>=6.0",
    "lancedb>=0.40",
    "pyarrow>=26.0",
    "numpy>=2.5",
    "rapidocr>=3.10",
    "onnxruntime>=1.31",
    "keyring>=25.7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/universe_vault"]

[tool.uv.sources]
universe-common = { workspace = true }
universe-models = { workspace = true }
