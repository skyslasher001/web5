[project]
name = "universe-agents"
version = "0.1.0"
description = "Agent definitions, model providers and the model router"
requires-python = ">=3.12,<3.13"
dependencies = [
    "universe-common",
    "universe-models",
    "pydantic>=2.14",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/universe_agents"]

[tool.uv.sources]
universe-common = { workspace = true }
universe-models = { workspace = true }
